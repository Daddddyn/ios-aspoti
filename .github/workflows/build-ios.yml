name: Build Aspotï IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No cache — we have no lock file

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: node build.js

      - name: Add iOS platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "ios/ already present, skipping"
          fi

      - name: Patch AppDelegate for background audio
        run: cp ios-support/AppDelegate.swift ios/App/App/AppDelegate.swift

      - name: Patch Info.plist
        run: |
          PLIST="ios/App/App/Info.plist"
          if ! grep -q "UIBackgroundModes" "$PLIST"; then
            python3 - "$PLIST" << 'PYEOF'
          import sys, plistlib, pathlib
          p = pathlib.Path(sys.argv[1])
          data = plistlib.loads(p.read_bytes())
          data['UIBackgroundModes'] = ['audio']
          data['NSAppTransportSecurity'] = {'NSAllowsArbitraryLoads': True}
          data['NSMicrophoneUsageDescription'] = 'Aspoti does not use the microphone.'
          p.write_bytes(plistlib.dumps(data, fmt=plistlib.FMT_XML))
          print("✓ Info.plist patched")
          PYEOF
          else
            echo "Info.plist already patched"
          fi

      - name: Cap sync
        run: npx cap sync ios

      - name: Pod install
        run: |
          cd ios/App
          pod install --repo-update

      - name: Build unsigned archive
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            archive

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" \
                "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r Aspoti.ipa Payload/
          echo "✓ Aspoti.ipa ready"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Aspoti-IPA
          path: ${{ runner.temp }}/Aspoti.ipa
          retention-days: 30
